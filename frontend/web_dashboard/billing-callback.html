<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Complete - TillTrack</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h2 { color: #007b3c; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #00a650;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { background: #008c44; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✅</div>
        <h2>Payment Received</h2>
        <p>Your subscription has been processed. It may take a few moments to reflect in your dashboard.</p>
        <a href="index.html">Return to Dashboard</a>
    </div>
</body>
</html>
