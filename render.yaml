services:
  - type: web
    name: mpesa-service-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mpesa-service-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_MPESA
        value: true
